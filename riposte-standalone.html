 lost here works for him.")},Bm={1:[g("wick","It’s fine. It’s all fine. I’m only scared of water, wind, and being stepped on."),g("wick","Rule one: they set traps, you set answers. Rule two: don’t drop me.")],2:[g("wick","We’re halfway down. It’s colder. I am bravely not flickering."),g("wick","Patrons, Venues, things with too many knives. This floor has everything.")],3:[g("wick","The Last Table is just past this. I can feel it. It feels like a held breath."),g("wick","Whatever happens, I’m glad it was you holding me.")]},Dm=g("dealer","Oh, and an old friend is waiting for you on this floor: {name}. It remembers your face."),Fi=[[g("narrator","Under the Last Table, a stair keeps going down. At the bottom is the night itself, the one that never ended."),g("wick","This is where the sun went. I can smell it. It smells like a blown-out birthday.")],[g("narrator","Another night. The dark is thicker here, and it knows your name."),g("wick","Is it me, or is the sky up there a tiny bit less black?")],[g("narrator","Night {n}. Somewhere far above, a rooster wakes up confused."),g("wick","Keep going. Every night we clear, I get a little brighter.")],[g("narrator","Night {n}. You are further down than anyone has ever been."),g("wick","Not even the Ferryman comes this far. Just us. And whatever that noise is.")]],Lm=g("narrator","Night {n}. {boss} walks in the dark now, and it walks faster."),td={lantern_warden:{intro:[g("boss","Halt. Nobody passes the Lantern without a light."),g("boss","…You’ve got one. Hm. Then nobody passes without a fight.")],half:"A hundred years on this door. Do you know how dull that is? Thank you. Truly.",down:[g("boss","Go on, then. The door’s open. Tell the Dealer I’d like a chair."),g("wick","He was nice! For a man made of lamp.")],win:"Back of the queue, duelist. The queue is a hundred years long."},tide_broker:{intro:[g("boss","Welcome to the Market! Everything’s on credit, and your wish makes excellent collateral."),g("boss","Sign here. And here. And here. And here. I have a lot of hands.")],half:"Margin call! You’re overdrawn, duelist!",down:[g("boss","Fine! Debt forgiven! Do NOT tell the other creditors."),g("wick","Did we just get a hundred years of interest cancelled? Nice.")],win:"Your account is closed. Your candle is repossessed. Kidding! Mostly."},antlered_king:{intro:[g("boss","The forest came down to find the sun. It found you instead."),g("boss","Kneel, little light, or be root.")],half:"Wolves! Ride! THE WILD HUNT!",down:[g("boss","Go. If you find the sun, tell it the trees are still waiting."),g("wick","I’ll tell it. I’ll tell it twice.")],win:"Rest here. The moss will be gentle with you."},briar_queen:{intro:[g("boss","A trespasser in my court. How rude. How delicious."),g("boss","My Briarlings will show you out. In pieces.")],half:"Wrath of roses! Every petal a blade!",down:[g("boss","Plant me somewhere sunny. If you ever find somewhere sunny."),g("wick","That’s the saddest thing a rose ever said.")],win:"Barbs, darling. They’re how a flower says no."},bell_tyrant:{intro:[g("boss","Every chain you make rings my bell. Every bell makes me stronger."),g("boss","So please. Chain away.")],half:"DEATH KNELL. Count the rings, duelist.",down:[g("boss","…The bell’s cracked. Oh. I can finally hear myself think."),g("wick","And now I can hear ME think. I think: yay.")],win:"Ding. Dong. That was for you."},chorus_of_knives:{intro:[g("boss","WE ARE THE AUDIENCE."),g("boss","A HUNDRED YEARS WE WATCHED. NOW WE PERFORM.")],half:"CRESCENDO! ENCORE! ENCORE!",down:[g("boss","…Bravo. Genuinely. Bravo."),g("wick","Standing ovation. Mostly because they’re made of knives and can’t sit.")],win:"THE CRITICS HAVE SPOKEN."},impresario:{intro:[g("boss","Ladies, gentlemen, Echoes of all ages! Tonight: a duelist, LOSING!"),g("boss","Tickets are non-refundable.")],half:"The Grand Finale! Lights! Somebody find me LIGHTS!",down:[g("boss","Brilliant show. Terrible ending. Sold out, though."),g("wick","He asked for lights. I was RIGHT HERE.")],win:"And SCENE. Same time tomorrow? You’ll be back. They always come back."},leviathan:{intro:[g("narrator","The water goes very still. Something underneath it is the size of a street."),g("boss","…SMALL. LOUD. EDIBLE.")],half:"MAELSTROM.",down:[g("narrator","It sinks without a sound. The drowned docks of Vesper rise a hand’s width out of the sea."),g("wick","I did not enjoy that. Water is my whole list of fears.")],win:"BURP."},magpie_king:{intro:[g("boss","Ooh. OOH. What’s that you’re holding? Is it a sun? I collect suns."),g("boss","I’ll take that Reaction. And that one. And that one.")],half:"Treasure storm! Every shiny thing, ATTACK!",down:[g("boss","Keep the candle. I’ve got a crown. A whole city’s crown. Nobody’s using it."),g("wick","He called me shiny. I’m choosing to take that as a compliment.")],win:"Mine. Mine. Also mine."},blotted_saint:{intro:[g("boss","I copied out the Accord, fair and true. Then I improved it."),g("boss","Hold still. Let me correct your deck.")],half:"Illumination! Let the margins burn!",down:[g("boss","The ink is running. Oh. I can read the original again. It was… better."),g("wick","Every move has an answer. Even a sermon.")],win:"There. Now your story ends the way I wrote it."},last_dealer:{intro:[g("boss","Cassius Vane, at your service. Or the Last Dealer, if you’re superstitious."),g("boss","House rules: I deal, you lose, nobody goes home. Cut the deck?")],half:"Oh, you’re GOOD. Fine. ALL IN.",down:[g("boss","…Well played. Genuinely. The Last Table is yours."),g("boss","Go on. You’ve earned it. Ask.")],win:"The house always wins. I should know. I am the house."},clockmaker:{intro:[g("boss","Shh. It’s almost midnight. It has been almost midnight for a hundred years."),g("boss","If no time passes, nothing is lost. Do you understand? NOTHING.")],half:"TWELVE. TWELVE. TWELVE.",down:[g("boss","Tick. …Tock. Oh. I’d forgotten that sound."),g("wick","Time’s moving again. Let’s use it.")],win:"Stay. Stay forever. It’s only ever one minute to midnight here."},forgemother:{intro:[g("boss","Every card in this Circuit came out of my fire. Including the ones in your hand."),g("boss","I made them. I can unmake them. Come here, little deck.")],half:"THE CRUCIBLE! Into the mould!",down:[g("boss","Good metal. Keep it. Make something better than I did."),g("wick","She was warm. Like, actually warm. I liked that part.")],win:"Back into the fire. I’ll make something new out of you."},orrery:{intro:[g("boss","Without a sun, I turn the stars by hand. All of them. Do you know how many there are?"),g("boss","Sun or moon, little duelist? Call it.")],half:"The planets align. ECLIPSE!",down:[g("boss","The gears are slowing. Someone else will have to turn the sky now."),g("wick","Volunteering! Small candle, big sky. Easy.")],win:"Moon. It was always going to be moon."},gravelord:{intro:[g("boss","Every duelist who loses here comes to me. I keep them. I raise them. I play them."),g("boss","Rise, my skeletons. We have company.")],half:"Bones rise! They always rise!",down:[g("boss","Tell the Sexton he can have them. Tell him the ground can have them all."),g("wick","Rest well, everybody. You earned it.")],win:"Welcome to the choir. Pick a bone. Any bone."},reflection:{intro:[g("wick","Er. That’s… you."),g("boss","Every winner sits in this seat. Every winner becomes me. That’s the Circuit’s real trick."),g("boss","The only deck that can answer yours is yours. Shall we?")],half:"You’re winning. That’s what I did, too.",down:[g("boss","…Then go. Leave the seat empty. Nobody ever has."),g("wick","You beat yourself. In the good way!")],win:"Don’t worry. I’ll take good care of your deck."},night_mare:{intro:[g("boss","You beat the house and you still came down? Sweet dreams, duelist."),g("wick","Horse. Big horse. Big dark horse. Cool cool cool.")],half:"Wake up. WAKE UP. Oh, you can’t.",down:[g("narrator","The dream breaks. Far above, a bird you have never heard starts to sing."),g("wick","That’s a morning bird. Mornings have birds! I forgot!")],win:"Sleep. Just a little longer. Forever is only a little longer."},dawn_eater:{intro:[g("boss","I ate your sun. I am still hungry."),g("wick","…That’s it. That’s the thing that ate me. I’m going to need a minute."),g("wick","Minute’s over. Get it.")],half:"HUNGER.",down:[g("narrator","It coughs up a sliver of gold light. Wick drinks it in and burns twice as bright."),g("wick","I got some of me back! I’m like eleven percent sun now!")],win:"Crunchy little candle. Delicious."}},ad={intro:[g("boss","So. You’re the one carrying the candle.")],half:"Not bad. Not good enough.",down:[g("wick","Down it goes! Onward and downward.")],win:"Deal again, duelist."},Gm=["An Echo shuffles a deck somebody once loved. It plays the same way they did.","The Circuit keeps a copy of everyone who sits at its tables. Here is one of them.","The Echo nods at you, polite as a ghost. It has played this hand ten thousand times."],Wm=[g("dealer","I kept something for you. Last time you left in a hurry and forgot your deck."),g("wick","Wait. Those are your cards. Why is it holding your cards?"),g("dealer","Everyone who sits at my table leaves an Echo. This one plays exactly like you did."),g("wick","Then we know every trick it has. Let’s show it the new ones.")],Ii=["☠ {name} remembers you. It has been practising.","☠ {name}: “Twice now. You never learn.”","☠ {name}: “Again? I’m starting to like you.”"],Fm={archivist:"Wick: “She has a file on everyone. Mine is mostly complaints.”",bellmaiden:"Wick: “She rang the bell before every duel for two hundred years. Now nobody listens. Be nice.”",ferryman:"Wick: “He carried me for a century. Don’t let him tell you I whined.”",gardener:"Wick: “She grew the hedges that wall the Circuit. Everything here is her garden, even the bits that bite.”",masked:"Wick: “Nobody knows who signed the Accord in a mask. I have theories. They’re all bad.”"},Im=[g("narrator","Beyond the last fight is a small round table, a deck, and a man in a dealer’s waistcoat who has not slept in a hundred years."),g("dealer","The Last Table. Nobody’s reached it since me. You’ve won your Ask, duelist. Make it a good one.")],Om=[g("dealer","Don’t look so surprised. Somebody had to beat me eventually. Go on: ask.")],Nm=[g("dealer","Granted. One small print, though. The house always keeps a copy."),g("narrator","Somewhere in the Circuit, a new Echo picks up your deck and starts to shuffle.")],jm=[g("narrator","You do not sit in the seat. You walk back up the stair, all of it, with a candle that will not stop grinning."),g("narrator","Above Vesper, for the first time in a hundred years, a thin grey line opens between the roofs and the sky."),g("wick","That’s not the sun yet. But it’s the sun thinking about it.")],zm=[g("narrator","The Reflection keeps the seat warm, and keeps your face."),g("wick","You still won your Ask. Next time, we take the mirror too.")],Ym=[{min:0,beats:[g("narrator","The Long Night swallows you, but the Ask is already yours."),g("wick","We went further down than anyone. That counts. I’m counting it.")]},{min:1,beats:[g("narrator","You cleared {n} night(s). Above, the sky over Vesper is a shade lighter. People are pointing at it."),g("wick","They’re pointing at US. Well, at our handiwork.")]},{min:3,beats:[g("narrator","You cleared {n} nights. Somewhere in Vesper, a baker opens up, because it feels like morning."),g("wick","Bread! There will be bread! Because of us!")]},{min:6,beats:[g("narrator","You cleared {n} nights. The dark itself has started keeping its distance from you."),g("wick","I think the night is scared of us. I would be.")]}],Vm=["I’m still lit. You’re still you. Deal again?","Next time, maybe don’t hit the thing with the spikes.","Losing is just practice with a worse ending.","New plan: same plan, but better.","Hey. Hey! We got further than a hundred years of duelists. Probably. I’m guessing."],qm=["The first crossing is free. They’re all free. That’s the problem.","Back in the boat. Mind the oar.","The river and I agree: you were close.","I’ll have you at the top of the stair before the candle cools."],Um=g("narrator","{name} has your scent now. It will be waiting next run."),Os={duelist:{who:"The last student of the Ember school, whose grandmother trained under Cassius Vane. The ash on the coat is from the night the sun went out.",ask:"That Cassius Vane loses. Just once.",motive:["My grandmother was his student. Her last words were: “Somebody has to answer him.”","Ember school. We parry, then we burn. Let’s go."],acts:["Grandmother walked this road. She said the lamps were friendlier back then.","Halfway. I can hear his cards being shuffled from here.","Cassius. I’m coming to finish your lesson."],retort:"Every move has an answer. Here’s mine.",rivals:{last_dealer:"You taught my grandmother. She taught me the answer to you. It’s one word: riposte."},mirror:"Grandmother used to say the hardest duel is the one against your own habits.",win:[g("class","I ask that Cassius Vane loses."),g("dealer","…That’s it? Not wealth, not the sun, not revenge?"),g("class","You never lost. Not once in a hundred years. That’s why you’re stuck."),g("dealer","Oh. Oh, that’s cruel. That’s… kind. Thank you.")],trueEnd:"You pin the ash-grey coat over the door of the old Ember school. It can come down now.",fall:"Ash to ash. Coat’s still on. Again."},warden:{who:"Keeper of the Ninefold Garden above the Circuit, where nothing has grown in a century except barbs, which the Warden keeps alive out of spite.",ask:"One spring.",motive:["I’ve got seeds in my pocket that have been waiting since my grandfather’s time. They’re getting impatient.","Let them hit me. Barbs are patient. So am I."],acts:["Roots down here. Somebody has been gardening badly.","Good soil, this. Shame about the knives.","Nearly there. I can feel the seeds in my pocket waking up."],retort:"Go on, swing. I’m mostly barbs.",rivals:{briar_queen:"You’re one of mine. A cutting I lost down a drain thirty years ago. You’ve grown.",antlered_king:"You brought the forest down here. I’d like to bring it back up."},mirror:"Huh. Do I always frown like that? I always frown like that.",win:[g("class","One spring. That’s all I want. One proper spring."),g("dealer","A gardener’s wish. Small, sensible, utterly impossible without a sun."),g("wick","Hello. Sun. Right here. Bit of me, anyway."),g("class","Then that’s a yes.")],trueEnd:"Up top, a single green shoot pushes through the barbs. You don’t say anything. You just water it.",fall:"Pruned. Barbs grow back. So do I."},hollow:{who:"A duelist who already won a small Ask, decades ago, and asked to forget a grief. The Circuit took it, and the name, and the face, and everything that went with it.",ask:"Give it back. All of it. Even the part that hurt.",motive:["I don’t know what I lost. I know it was worth forgetting. I want it back anyway.","Empty hands make good cards. Nothing to drop."],acts:["I’ve been here before. I don’t remember it. That’s the problem.","Something on this floor knows my name. I want to ask it.","Whatever I gave up is at the bottom. I can feel the shape of the hole."],retort:"You can’t hurt what isn’t there.",rivals:{blotted_saint:"You wrote over me. I can see my name under your ink.",reflection:"It has my face. I’d forgotten I had one."},mirror:"So that’s what I look like. Huh. Not bad.",win:[g("class","Give it back. Whatever I asked you to take."),g("dealer","It hurt so much you paid a wish to lose it."),g("class","I know. Give it back anyway."),g("narrator","Something comes home behind your eyes. It hurts. You have a name again. You keep it.")],trueEnd:"You tell Wick your name on the way up. Wick says it’s a good one. Wick is right.",fall:"Hollow again. Fine. I’m good at hollow."},sharp:{who:"A grifter, card mechanic and part-time liar, who came down because every house can be beaten, and this is the biggest house there is.",ask:"Everything the house has ever won.",motive:["The house always wins? Lovely. That means the house has a LOT of money.","Heads I win, tails you lose. Shall we?"],acts:["Nice place. Terrible security.","Halfway down and nobody’s caught me cheating. Mostly because I haven’t. Yet.","The big table. My hands are actually sweating. Don’t tell anyone."],retort:"Call it. Wrong. Try again.",rivals:{last_dealer:"Professional courtesy, Cassius?",impresario:"We had a double act once. He kept the money.",magpie_king:"You still owe me a crown."},mirror:"Oh, this one’s good. It cheats exactly like I do.",win:[g("class","I ask for everything the house has ever won."),g("dealer","That’s a hundred years of mornings. The house won them all."),g("class","…Fine. I’ll take the mornings."),g("wick","You just did a good deed by accident."),g("class","Tell anyone and I’ll deny it.")],trueEnd:"You sell the first sunrise in a century to absolutely nobody, because it’s free. You’re still a bit annoyed about that.",fall:"Double or nothing. I’ll take double next time."},magpie:{who:"The best thief the Magpie King’s flock ever hatched. She came down to steal the one thing nobody has ever stolen: an Ask.",ask:"Nothing. She takes it.",motive:["Everyone asks. I don’t ask. I take.","Pockets: empty. Hands: quick. Conscience: misplaced."],acts:["Shiny, shiny, trap, shiny. I love this floor.","The old man’s nest is on this floor. I’m not visiting. I’m robbing.","The Ask is down there, unguarded except by everything. Perfect."],retort:"I’ll be taking that.",rivals:{magpie_king:"Hi, Dad. No. You’re not my dad. You’re a bird."},mirror:"It stole my face. Respect.",win:[g("class","I don’t ask. I just… take it."),g("dealer","You can’t steal a wish."),g("class","Already did. It’s in my pocket. Now…"),g("class","Here, Wick. Shiny. Do something nice with it."),g("wick","For me? Oh, I’m going to cry wax.")],trueEnd:"The first thing she ever gave away. She tells everyone she stole the sunrise. Nobody can prove otherwise.",fall:"Caught. Bad luck. Not bad skill."},sexton:{who:"The Circuit’s gravedigger for a hundred years. Nobody dies down here, so he buries what is left: lost cards, tired decks, Echoes that cannot play another hand.",ask:"Let them rest.",motive:["Nothing stays dead in the Circuit. I would like to change that. Gently.","Spade’s sharp. Crypt’s open. Let’s fill it."],acts:["I know every grave on this floor. I dug most of them.","The Middle Circuit. The graves here are shallow. Mind your step.","The Deep. Older graves. Older debts."],retort:"Everything ends. I’m just the one who tidies up.",rivals:{gravelord:"You keep digging up my work."},mirror:"Hm. I always wondered who would bury me.",win:[g("class","Let them rest. Every Echo. Every deck. Let me fill in the last grave."),g("dealer","Even mine?"),g("class","Especially yours, Cassius. You look tired."),g("dealer","…I am. Thank you, gravedigger.")],trueEnd:"You plant your spade at the top of the stair and leave it there. Somebody else can dig now. You’d like to see a sunrise first.",fall:"Buried again. I know the way out."},arbiter:{who:"The last judge of the House of Dawn, who kept the Accord. A hundred years late, the Arbiter is holding the hearing for the Unanswered Hand.",ask:"A ruling: the Unanswered Hand is out of order.",motive:["The court of Dawn is now in session. Defendant: Cassius Vane. Charge: the last word.","Objection first, questions later."],acts:["Evidence, everywhere. Mostly evidence that things want to bite me.","Halfway to the bench. The witnesses here are all made of knives.","The Deep. The defendant is close. I can smell the smugness."],retort:"Objection!",rivals:{blotted_saint:"You defaced the Accord. That is a crime, and also rude.",last_dealer:"Cassius Vane, you are summoned."},mirror:"I will not be cross-examined by myself. …Fine. Proceed.",win:[g("class","I ask for a ruling: the Unanswered Hand is out of order."),g("dealer","There’s no law that covers it. I checked. For a century."),g("class","Then I set one. Every last word can be answered. Precedent: this hearing."),g("dealer","Objection?"),g("class","Overruled.")],trueEnd:"You carve the new ruling over the door, under the old rule. EVERY MOVE HAS AN ANSWER. EVEN THE LAST ONE.",fall:"Adjourned. Not dismissed."},tempest:{who:"A storm-chaser who has spent years bottling lightning, on the theory that the sun is just a very big spark.",ask:"To see the real sky. Just once.",motive:["The sun’s a big spark, right? I’ve got sparks. LOTS of sparks.","Stand back. Stand further back. Okay, that’s good."],acts:["Underground thunder sounds amazing. Listen to that echo!","Halfway. My bottles are humming. That’s a good sign or a very bad one.","Last floor. I’m saving the big bottle for the end."],retort:"Charging. Charging. CHARGED.",rivals:{orrery:"You’ve been running the stars without a sun? On WHAT?"},mirror:"Whoa. Am I always this loud? …Yes. Good.",win:[g("class","I just want to see the sky. The real one."),g("dealer","The sky’s black, duelist. It’s been black for a century."),g("class","Then I’ll bring my own light."),g("narrator","Every bottle opens at once. Lightning runs up the stair and out over Vesper, and for one second the whole city is lit.")],trueEnd:"One second of lightning, then a slow grey dawn. You stand on a roof and yell at it until it’s embarrassed.",fall:"Discharged. Recharging."},rimeblade:{who:"A duelist who froze herself on the night of the Unanswered Hand rather than become an Echo. She thawed last winter. Her sister Isolde did not freeze in time.",ask:"Let Isolde put her cards down.",motive:["A hundred years in the ice. Everyone I knew is an Echo now. One of them is my sister.","Cold hands. Steady hands."],acts:["The lamps are different. Everything is different. Except the cold.","Isolde played her best hands on this floor.","If she’s anywhere, she’s down here."],retort:"Hold still. This will be cold.",rivals:{clockmaker:"You stopped time. I stopped myself. Neither of us got what we wanted."},mirror:"For a second I thought it was Isolde. We always did look alike.",win:[g("class","Let Isolde put her cards down."),g("dealer","One Echo. Out of thousands."),g("class","I know. Start with her."),g("narrator","Far above, an Echo in a blue coat sets her deck on a table, stretches, and laughs for the first time in a century.")],trueEnd:"Isolde is waiting at the top of the stair. She is a little cold. So are you. You hold hands until you aren’t.",fall:"Frozen out. Not frozen."},beastcaller:{who:"Raised by the pack in the Hollow Woods, the forest that came down looking for the sun. The Antlered King was once the pack’s gentle old leader.",ask:"Let the pack see the sky.",motive:["The pack has never seen the sky. Not once. Not one of them.","Wolf says hello. Bear says nothing. Bear never says anything."],acts:["Smells like home down here. Home smells like wet dog.","Hawk doesn’t like ceilings. Hawk is being very brave.","Last floor. Everyone stay close. Yes, you too, Serpent."],retort:"Pack! With me!",rivals:{antlered_king:"You were kind once. You taught me to howl."},mirror:"The pack is confused. There are two of me. There is only one of the bear, thank goodness.",win:[g("class","Let the pack see the sky."),g("dealer","Just the animals? Not you?"),g("class","I’m in the pack, Dealer. Where else would I be?")],trueEnd:"The first thing the pack does under an open sky is howl at it. The second thing is nap.",fall:"Pack’s tired. We go home. We come back."},geomancer:{who:"An engineer of Vesper’s foundations. The Circuit holds the city up, and every year without an answer the stone cracks a little more.",ask:"That Vesper stays up.",motive:["There’s a crack under the old cathedral the width of my hand. It was a finger last year.","No hurry. The mountain isn’t in a hurry either."],acts:["Load-bearing walls with spikes on. Original features.","The pilings are wet here. Something is eating them.","Bedrock. Finally. Somewhere solid to stand."],retort:"I don’t move. You move around me.",rivals:{leviathan:"You’re eating my pilings.",forgemother:"You’re melting my foundations. Stop that."},mirror:"Like arguing with a wall. I should know. I’ve built walls.",win:[g("class","I ask that the city stays up. That’s all."),g("dealer","That’s a big ask, for a small one."),g("class","It’s a big city."),g("narrator","Somewhere under the cathedral, a crack quietly closes.")],trueEnd:"Dawn shows the city the way you see it every day: standing. You check the cathedral anyway. Twice.",fall:"Subsidence. Temporary."},alchemist:{who:"A scholar who believes a sun can be brewed, and wants the one formula nobody has ever written down: how a wish actually works.",ask:"The recipe.",motive:["If a wish can make the sun go out, a wish can be reverse-engineered. I brought notes.","Flask, flame, formula. Fun!"],acts:["Fascinating. Everything here is trying to kill me in a different element.","Halfway. My samples are excellent. My hands are shaking. Unrelated.","The source is close. I can taste copper and destiny."],retort:"Let’s see what you’re made of. Literally.",rivals:{forgemother:"You made the cards. What are they made of?"},mirror:"A perfect control sample. Me versus me. Hypothesis: I win.",win:[g("class","I ask for the recipe. How does an Ask work?"),g("dealer","One answer, freely given, at the right moment. That’s it."),g("class","…That’s not chemistry. That’s a metaphor."),g("wick","Welcome to magic, nerd.")],trueEnd:"You write it down anyway: ONE ANSWER, FREELY GIVEN. Then, under it, in small letters: “still checking”.",fall:"Failed experiment. Very informative."},nightblade:{who:"The last blade of the House of Dusk, sworn to end whoever broke the Accord. One name has been at the top of the list for a hundred years.",ask:"His name, crossed off.",motive:["One name on the list. Cassius Vane. A hundred years overdue.","Quiet now. Mark the target."],acts:["Shadows here are thin. I’ll make do.","Halfway. The target hasn’t moved in a century.","The Deep. Close enough to hear him breathe."],retort:"Marked.",rivals:{last_dealer:"Cassius Vane. You’re a hundred years overdue."},mirror:"Even my shadow has a shadow. Annoying.",win:[g("class","His name. Crossed off the list."),g("dealer","Go on, then. I won’t stop you."),g("class","The oath says a broken Accord must end. It doesn’t say who ends. I ask that the Accord be kept."),g("dealer","So someone answers me instead of killing me. You’re soft, Dusk."),g("class","I’m thorough.")],trueEnd:"You cross the name off the list. Under it you write a new one: “Nobody.” It is the best list you have ever kept.",fall:"Missed. I don’t miss twice."}},Km="Every move has an answer, Dealer. Even yours.",mn=[{id:"deal",title:"Deal Me In",hint:"Start a run.",text:["Vesper is a city of eight Houses. The six elemental Houses (Blaze, Frost, Wild, Storm, Flood and Stone) drew up the Wheel: each beats the next two and loses to the two before, so no House can ever rule them all.","The House of Dawn judged their duels. The House of Dusk punished anyone who cheated. And under it all ran the Undercroft Circuit, three floors of duel halls, and at the bottom, the Last Table.","Win the Last Table and the Circuit grants you one Ask. Kings were crowned that way. Rivers were moved. One man asked for the last word."]},{id:"ferry",title:"The Ferryman’s Fare",hint:"Lose a run.",text:["Nobody dies in the Circuit. The Accord forbade it: a duel is for settling things, not ending them. So when you fall, the Ferryman rows you back up the black river to the top of the stair.","He has done this for every duelist for a hundred years. He does not charge. He says the fare is that you try again.","He carried Wick for all that time, too, in a jar, waiting for someone stubborn enough to take the candle down."]},{id:"door",title:"The Door",hint:"Beat an Act I boss.",text:["The Upper Circuit was the public floor: market stalls, practice halls, the lamplit road to the stair. When the sun went out it was the first floor to go strange.","The Lantern Warden stayed on the door because nobody relieved him. The Tide Broker kept lending money in a city where nobody could leave. And the forest, finding no sun above, grew down through the cracks to look for it."]},{id:"grudge",title:"A Grudge",hint:"Get a Nemesis.",text:["Things in the Circuit feed on winning. When one of them beats you it gets a taste, and it remembers.","Next run it will be waiting for you, promoted and pleased with itself. Beat it and it lets go. Lose to it three times and it gets bored and moves on, which somehow feels worse."]},{id:"audience",title:"The Audience",hint:"Beat an Act II boss.",text:["The Middle Circuit was where the famous duels were held. The audience never left. A hundred years of watching turned them into the Chorus of Knives.","The Impresario still sells tickets. The Leviathan moved into the drowned docks. And the Patrons, five old founders of the Accord, still haunt the stairs between floors, offering gifts with strings attached."]},{id:"copies",title:"Copies",hint:"Fight an Echo or mint a Legacy deck.",text:["The Circuit keeps a copy of everyone who plays at its tables. That is what an Echo is: a deck that kept playing after its duelist stopped.","When you mint a Legacy deck you leave a copy on purpose. It will be waiting for the next duelist. It may even be waiting for you."]},{id:"table",title:"The Last Table",hint:"Win a run.",text:["You reached the Last Table and made your Ask. The Dealer granted it. He always does. He always takes a copy, too.","Every winner gets what they asked for. Nobody has asked for the sun back yet. Wick has noticed. Wick is being very patient about it."]},{id:"cassius",title:"Cassius",hint:"Beat the Last Dealer.",text:["Cassius Vane never lost a duel. Not one. When he won the Last Table, he asked for the only thing he did not have: the last word, a move no one could answer.","The Accord could not hold both rules at once. It broke. The Dawnwick, the great lamp at the Last Table whose fire was Vesper’s sun, cracked and went dark.","Cassius got exactly what he asked for. He has the last word forever. He can never play again, only deal. The house always wins, because he is the house."]},{id:"mirror",title:"The Mirror",hint:"Face the Reflection.",text:["Behind the Last Table hangs a mirror. Every winner sees it. Every winner sits down in front of it, sooner or later.","This is the Circuit’s real trick. Winners don’t leave. They become the next thing a duelist has to beat. The only deck that can answer yours is yours."]},{id:"night",title:"The Long Night",hint:"Descend into the Long Night.",text:["Under the Last Table the stair goes on, down into the night itself, the one that never ended.","The thing that swallowed the sun lives down there, with the Night Mare and worse. Every night you clear, the sky over Vesper gets a shade lighter. People have started to notice."]},{id:"masked",title:"The Masked Signature",hint:"Win 3 runs.",text:["Five founders signed the Accord: the Archivist, the Bellmaiden, the Ferryman, the Gardener, and a fifth who signed in a porcelain mask.","The Archivist’s records say the masked one was the House: the cut every game takes. The House was the one who whispered to Cassius, the night of the Unanswered Hand, that he deserved the last word.","The House does not want the sun back. A city in the dark plays cards all night."]},{id:"riposte",title:"The Dawnwick",hint:"Beat the Reflection.",text:["Here is the secret the Accord was hiding in plain sight. Every move has an answer. Cassius has the last word. Both can be true only if someone answers after the last word.","The old fencing schools of Vesper call that reply a riposte. The Dawnwick never burned on wishes. It burned on answers.","Every time a duelist beats the mirror and walks out, the Dawnwick catches a little. Not as a prize. As a reply.","Wick has noticed. Wick is being very patient about it."]}],nd="riposte.story.v1",Oi=()=>({on:!0,prologue:!1,beats:{},order:[],done:[],read:[],stats:{runs:0,deaths:0,wins:0,bosses:[],won:[],mir       <h3>The run</h3>

      <p>Owned cards appear twice as often in runs, and <b>Legendaries</b> only appear once you own them. In <b>Loadouts</b> you can swap starter cards for owned ones. At the end of a run you keep <b>souvenir</b> cards from your final deck.</p>
      <p>Every level gives a <b>talent point</b> for the three schools (Guard, Coin, Feint) plus 50 Coins and a pack. <b>Trophies</b> unlock new keepsakes. Daily Duels ignore all of this so everyone starts equal.</p>

      <h3>Mastery and cosmetics</h3>
      <p>Every card you play earns mastery. Each level pays Dust and upgrades the card frame (Bronze, Silver, Gold, Prismatic, Living). Familiars, card backs and titles come from the Season track, trophies and the Arena. None of them change gameplay.</p>
      <h3>The Magpie and Glass (v0.4)</h3>
      <p>:px-shard: <b>Glass</b> cards <b>Steal</b>: they take the enemy's oldest face-down trap and set it in your own free Reaction slot, where it fires for you. A trap with no room becomes a <b>Glint</b>, a 0-cost shard that deals 4 damage to a random enemy. <b>Mimic</b> repeats the last Attack or Trick you played this turn. Some enemies steal too: kill them to get your card back.</p>
      <h3>Damage preview</h3>
      <p>Select a card and the enemy HP bars show what it would do. Face-down traps you can't see are left out, and a ⚠ line tells you how many could answer it.</p>
      <h3>Wandering bosses and the Reflection</h3>
      <p>Each act has a 1 in 3 chance to be ruled by a wandering boss instead: the Briar Queen, the Magpie King or the Orrery. Slay 2 🔥 Champion rivals in one run and, after the Act 3 boss, you may step into <b>Act 4</b> and fight <b>the Reflection</b>, which plays your own deck back at you.</p>
      <h3>Riddles of the Chain</h3>
      <p>Hand-made one-turn puzzles in the Events tab. Everything is face-up and nothing is random. Find the order that wins.</p>
      <h3>The Sexton and the Crypt (v0.5)</h3>
      <p>:px-urn: <b>Grave</b> cards work your <b>Crypt</b>. While you play the Sexton, your Reactions go to the Crypt when they leave play instead of the discard pile. <b>Haunt</b> effects fire as a card is buried. <b>Exhume</b> sets the newest buried Reaction again for free, and <b>Bury</b> puts the top of your draw pile into the Crypt. Tap ⚱ by your piles to see it.</p>
      <h3>Prime and Converge</h3>
      <p><b>Prime</b> Reactions gain 1 Prime each turn they stay set and hit harder for it (the 🌞 number on the slot). <b>Converge</b> counts the different factions you have played this turn, so mix your colours before you play it.</p>
      <h3>Venues</h3>
      <p>Some fights happen at a <b>Venue</b> that changes the rules for everyone: fewer or more Reaction slots, longer chains, lightning, Barbs for all… Rival and boss Venues show on the map; tap the chip at the top of a fight to read it.</p>
      <h3>Patrons, Nemesis, the Long Night</h3>
      <p>At the start of Acts 2 and 3 a <b>Patron</b> offers three blessings; take one or none. A Patron's gift is a loan: unless you pay the debt off at a Merchant (💰 ${xa}), the Patron sits in on that act's boss fight and gives the boss an extra trap. The normal or rival fight that ends a run becomes your <b>Nemesis</b>: next run it waits in the same act, promoted, and beating it pays extra. After your first win, beating the Act 3 boss opens <b>the Long Night</b>: endless nights of rising danger for score.</p>
      <h3>Wilds &amp; Wonders (v0.6)</h3>
      <p>Every act now comes in <b>three versions</b> (the third: the Hollow Woods, the Wreckers' Coast, the Molten Deep) and rolls a <b>map Layout</b> and a <b>Sky</b> that bends the act: Fog hides the map, a Blood Moon brings rivals, a Gale blows strangers onto the road. Tap the pills under the act name to read them.</p>
      <p>At the start of a run you keep one of three <b>Fates</b>: mixed blessings like the Gambler (rich, but shops cost more) or Oath of Steel (+1 Reaction slot, less HP). 🔮 <b>Mystery</b> nodes could be anything; ⛩️ <b>Shrines</b> offer upgrades, sigils and boons. On the way to a node, something may happen on the <b>road</b>, and in the middle of a fight, a <b>Surprise</b> may pop up. <b>Rare monsters</b> (a Gilded Hare, a Treasure Crab, a Wishing Star) run away after 3 turns: catch one for gold and a keepsake.</p>
      <h3>Blot</h3>
      <p>Ink enemies <b>Blot</b> cards in your draw pile: a Blotted card (🖋) costs 1 more until the fight ends.</p>
      <h3>Elements (v0.7)</h3>
      <p>Every card and enemy has an element. Six sit on a wheel: 🔥 Blaze → ❄️ Frost → 🌿 Wild → ⚡ Storm → 🌊 Flood → 🪨 Stone → back to 🔥. Each one is <b>Effective</b> (×1.3 damage) against the next two and <b>Resisted</b> (×0.75) by the two before it and by itself. ✨ Radiant and 🌑 Umbral sit outside the wheel and are Effective against each other.</p>
      <p>Enemies show their <b>Aspect</b> by their name. Your <b>Attunement</b> (the chip by your HP) is the element of the last elemental card you played, and it is your element when they hit you, so the order you play in matters for defence too. 🔮 <b>Prism</b> cards take your Attunement. Play 3 cards of one element in a turn for its <b>Resonance</b> bonus. Tap the chip to see the wheel.</p>
      <h3>Counters (v0.7)</h3>
      <p><b>Counters</b> (↯) stay in your hand (they Palm) and answer the enemy mid-chain: when an enemy trap fires or an enemy move is about to land, the chain <b>pauses</b> and shows the enemy card face-up: what it does, who it hits and how much damage gets through your Guard. Tap any link in the chain to read it, pick a Counter, then choose <b>Counter</b> or <b>Let it resolve</b>. Nothing happens until you choose. The game also stops every time an enemy trap, Counter or Rebuttal answers, even when you hold nothing that can answer back. After a chain the recap stays up until you tap Continue (tap a link to read what it did). With Counters set to Automatic or Never, the recap closes by itself. On your turn you pay energy; on the enemy's turn you pay with <b>Flux</b>. Counters can push a chain 2 links past its cap. From Act 2, rivals and bosses carry <b>Rebuttals</b> that cancel your first Counter, so bait them out. Change how you are asked in Settings.</p>
      <h3>New classes (v0.7)</h3>
      <p>⚖️ <b>Arbiter</b> (Dawn + Tide): counters for Verdict. 🌩️ <b>Tempest</b> (Storm + Tide): Charge and Shock. ❄️ <b>Rimeblade</b> (Rime + Glass): Chill, Freeze, Shatter. 🐾 <b>Beastcaller</b> (Beast + Storm): companions that act every turn. 🪨 <b>Geomancer</b> (Stone + Thorn): Fortify and Tremor. ⚗️ <b>Alchemist</b> (Aether + Ember): Prism cards and Catalyze. 🥷 <b>Nightblade</b> (Dusk + Void): Mark, Veil and executions.</p>
      <h3>Upgrades, Evolve and hybrids</h3>
      <p>Every card can be upgraded once, down one of two paths. <b>Path A</b> (Name+) raises its numbers. <b>Path B</b> (Name✦) keeps the numbers but the card costs 1 less (2+ cost cards), Palms (attacks and tricks), is Opener (Reactions, Counters and stances) or stops Folding. Tap the version you want in the upgrade window.</p>
      <p>🦋 <b>Evolve N</b>: play this copy N times in fights you win and it becomes the stronger card named in brackets for the rest of the run. Its upgrade carries over.</p>
      <p>⧉ <b>Hybrids</b> belong to two classes' home factions (say Ember and Rime) and mix their mechanics. Either class can draft them.</p>
      <h3>Legacy decks</h3>
      <p>Beat an act boss and you can mint your final deck. Minted decks return as <b>Echo</b> rivals: the game plays your old deck against you.</p>
